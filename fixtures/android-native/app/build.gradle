plugins {
    id 'com.android.application'
}

// Signing/version properties injected by caricamento via -P flags (SPEC.md §5.1).
def storeFileProp = project.findProperty('CARICAMENTO_STORE_FILE')
def storePasswordProp = project.findProperty('CARICAMENTO_STORE_PASSWORD')
def keyAliasProp = project.findProperty('CARICAMENTO_KEY_ALIAS')
def keyPasswordProp = project.findProperty('CARICAMENTO_KEY_PASSWORD')
def versionCodeProp = project.findProperty('CARICAMENTO_VERSION_CODE')
def versionNameProp = project.findProperty('CARICAMENTO_VERSION_NAME')

android {
    namespace 'com.example.caricamentofixture'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.caricamentofixture'
        minSdk 24
        targetSdk 35
        versionCode(versionCodeProp != null ? versionCodeProp.toInteger() : 1)
        versionName(versionNameProp != null ? versionNameProp.toString() : '1.0.0')
    }

    signingConfigs {
        release {
            if (storeFileProp != null) {
                storeFile file(storeFileProp)
                storePassword storePasswordProp
                keyAlias keyAliasProp
                keyPassword keyPasswordProp
            } else {
                // Test-only fallback so the fixture builds out of the box.
                // NEVER do this in a real project — see fixtures/README.md.
                storeFile rootProject.file('keystore/test-upload.keystore')
                storePassword 'android'
                keyAlias 'upload'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
