name: Defect
description: Problem with the docs, CI, contributor tooling, or the published npm package
title: "defect: "
labels:
  - defect
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this report.
        Use a bug report instead when the caricamento CLI itself misbehaves.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: The page, workflow, or package version, what you saw, and what you expected.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      description: What is broken?
      options:
        - Documentation
        - CI
        - Contributor tooling
        - npm package
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Paste the relevant CI log, command output, or a link is enough in the
        description above. This is rendered as a code block.
      render: shell
